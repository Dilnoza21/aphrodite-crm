name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "aphrodite_crm/"
          target: "/var/www/aphrodite-crm/"
          strip_components: 0

      - name: Rebuild and restart Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/aphrodite-crm/aphrodite_crm

            echo "=== Files on server ==="
            ls -la

            echo "=== Rebuilding Docker ==="
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "=== Container status ==="
            docker compose ps

            echo "=== Configuring system nginx ==="
            sudo tee /etc/nginx/sites-available/aphrodite-crm > /dev/null <<'NGINXEOF'
            server {
                listen 80;
                server_name _;
                client_max_body_size 10M;
                location / {
                    proxy_pass         http://127.0.0.1:5000;
                    proxy_set_header   Host              $host;
                    proxy_set_header   X-Real-IP         $remote_addr;
                    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_read_timeout 60s;
                }
            }
            NGINXEOF
            sudo ln -sf /etc/nginx/sites-available/aphrodite-crm /etc/nginx/sites-enabled/aphrodite-crm
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

            echo "=== Done at $(date) ==="
