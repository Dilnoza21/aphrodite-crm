<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aphrodite Dress CRM Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #F43F5E;
      --pink: #EC4899;
      --ink: #2A1622;
      --muted: #6B5460;
      --bg: #FBF2F7;
      --card: #FFFFFF;
      --line: rgba(124,45,94,.12);
      --grad: linear-gradient(130deg,#F43F5E,#EC4899 45%,#A855F7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: 'Manrope', sans-serif; color: var(--ink); background: radial-gradient(circle at top left, rgba(244,63,94,.18), transparent 28%), radial-gradient(circle at bottom right, rgba(168,85,247,.16), transparent 32%), var(--bg); display: grid; place-items: center; padding: 24px; }
    .container { width: min(520px,100%); background: rgba(255,255,255,.95); border-radius: 28px; box-shadow: 0 32px 90px rgba(124,45,94,.12); overflow: hidden; }
    .hero { padding: 42px 40px 30px; background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; }
    .brand .mark { width: 44px; height: 44px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 20px; }
    h1 { margin-top: 18px; font-size: clamp(32px,4vw,46px); line-height: 1.05; }
    p.lead { margin-top: 14px; color: var(--muted); line-height: 1.7; font-size: 15px; }
    form { padding: 30px 40px 42px; display: grid; gap: 20px; }
    .field { display: grid; gap: 8px; }
    label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
    input { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; font: inherit; font-size: 15px; background: #fff; transition: border-color .2s, box-shadow .2s; }
    input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(236,72,153,.12); }
    button { width: 100%; border: none; border-radius: 14px; background: var(--grad); color: #fff; font: inherit; font-weight: 700; font-size: 14px; padding: 16px 18px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-1px); box-shadow: 0 16px 30px rgba(236,72,153,.18); }
    .info { display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
    .info code { background: #f7edf4; padding: 4px 8px; border-radius: 8px; font-size: 13px; }
    .hint { padding: 18px 22px; border-radius: 18px; background: #fff4f9; border: 1px solid rgba(244,63,94,.12); color: #7c3aed; line-height: 1.6; }
    .err { min-height: 20px; color: var(--rose); font-weight: 700; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="brand"><span class="mark">A</span>Aphrodite Dress</div>
      <h1>Sign in to the CRM</h1>
      <p class="lead">Use your account to continue. Only the login page is exposed for this demo, with role-based access for admin users.</p>
    </div>
    <form onsubmit="event.preventDefault(); doLogin();">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" placeholder="admin"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="err" id="err"></div>
      <button type="submit">Sign In</button>
      <div class="hint"><strong>Demo credentials</strong><br>Super Admin: <code>superadmin</code> / <code>superadmin1234</code><br>Admin: <code>admin</code> / <code>admin1234</code></div>
    </form>
  </div>
<script>
  async function doLogin(){
    const u=document.getElementById('u').value.trim();
    const p=document.getElementById('p').value;
    const err=document.getElementById('err');
    err.textContent='';
    if(!u||!p){ err.textContent='Username and password are required.'; return; }
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      if(r.ok){ location.href='/dashboard'; return; }
      const j=await r.json(); err.textContent=j.error||'Invalid username or password';
    }catch(e){
      if((u==='admin'&&p==='admin1234')||(u==='superadmin'&&p==='superadmin1234')){
        const demoUser = {
          name: u === 'superadmin' ? 'Aphrodite Super Admin' : 'Aphrodite Admin',
          role: u === 'superadmin' ? 'Super Admin' : 'Admin'
        };
        localStorage.setItem('demoAuth', JSON.stringify(demoUser));
        location.href = 'dashboard.html';
      } else {
        err.textContent='Invalid username or password';
      }
    }
  }
  document.getElementById('p').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
